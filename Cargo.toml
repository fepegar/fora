[workspace]
members = [
    "azure_ml",
    "fora_tui",
    "fora_cli",
    "mlflow"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Common dependencies that can be shared across workspace members
ratatui = { version = "0.30", features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.28"
tokio = { version = "1.0", features = ["full"] }
azure_core = "0.32"
azure_identity = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = {version = "0.3", features = ["tracing", "env-filter", "fmt"] }
dashmap = "5.5"
futures = "0.3"
tokio-util = "0.7"
async-trait = "0.1"
dirs = "5.0"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "native-tls-vendored"] }
url = "2.4"
serde_with = "3.0"
bytes = "1"
lru = "0.12"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
ansi-to-tui = "8"
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
mime_guess = "2"
